## 学习内容

学习了Removable discontinuity : limit from both left & right are equal <br>
eg1: $f(x)=\dfrac{sinx}{x}$ <br>
      $f(0)$ is undifined , but $\lim_{x \to 0}f(x)=1$ <br>
eg2: $f(x)=\dfrac{1-cosx}{x}$ <br>
      $f(0)$ is undifined , but $\lim_{x \to 0}f(x)=0$ <br>
