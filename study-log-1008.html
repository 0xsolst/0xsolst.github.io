# 国庆假期：线代终于不是一堆公式了

先说实话：**9 月 29 号到 10 月 8 号这一段时间，我基本没学啥正经东西**。

假期嘛，节奏就是散的。真正算得上「学习」的只有一件事——把 **3Blue1Brown 的《线性代数的本质》** 看了一遍。

## 三蓝一棕：线代原来是有画面的

以前学线代的感觉，就是**背定义、算行列式、套公式**。矩阵在我眼里就是一堆数字排成的方阵；至于**矩阵乘法为什么是那么乘的**，书上只说「就这么规定」，然后给一堆例题让你算。

三蓝一棕完全走了另一条路——他不急着教你怎么算，先讲**这些东西到底在干嘛**：

- 一个**矩阵**，其实是一个「变换」：它对整个空间动手，把向量搬到别的地方去；
- **行列式** $|\det A|$，是这个变换把面积放大（或缩小）的倍数，等于 0 就说明整个空间被压扁了；
- **特征向量**，是在这个变换里「方向没变、只是被拉长或压短」的那些特殊方向。

看完之后最大的感受是：**以前我是「会算」，现在才第一次「能看见」**。行列式在我这儿从「交叉相乘再相减」的机械操作，变成了一个能量出来、能画出来的东西。

难怪之前刷线代题总觉得心里空落落的——**我压根不知道自己在搬什么砖**。

## 但我知道，这个「懂」还不算真懂

有一点我很清醒：**这个理解还得再回顾，而且要回顾好几遍**。

视频看着特别直白、特别顺，是因为每一条结论都是顺着几何直觉推下来的，**和我们现在这套应试教育的路径完全是两码事**。我看完觉得「原来如此」，但说实话，那是**三蓝一棕的直觉，不是我自己长出来的直觉**。

真要让它在脑子里扎根，还得自己动笔：把变换一个个画出来，把行列式当成面积去算，把特征向量在图上找出来。**看别人画的图，和自己画出图，是两回事。**

## 说点不太客气的：关于大学课堂

看完这个系列再回学校上课，感受特别割裂。

就像《上海交通大学生存手册》里那句话：

> 国内绝大部分大学的本科教学，不是濒临崩溃，而是早已崩溃。

今天的线代课，老师还在讲**「这个是重点」「这个是考点」**。我坐在下面听的时候，脑子里全是三蓝一棕那些能画出来、能转起来的画面——**明明可以是活的，非要教成死的**。

我越来越觉得：**如果大学还是应试教育那一套，真正想学的人只会越来越少**。真正的学习动力是「我想弄明白这是怎么回事」，而不是「这块考不考」。前者能让人熬夜琢磨，后者只能让人划重点。

## 程序设计课：像在上几十年前的课

今天程序设计课的感受也差不多。**讲的内容像是几十年前的内容**，一套老语法按顺序念下来，对现在 AI 的发展**只字不提**，也没法结合我们真正处在的这个时代去展开。

我理解中的程序设计课，本来应该教「怎么用程序解决问题」，顺带告诉你这个行业正在发生什么、AI 已经能干什么、还剩什么值得人去干。但现在更像是**把一本旧教材念完**。

## 看了 CS50 之后

后来又去看了哈佛的 **CS50**。看完只有一个感觉：**自学会更好**。

同样一门课，别人讲得有劲、有结构、有「为什么」，还顺带让你见识一下真正的计算机科学长什么样。

我不想把时间白白浪费在那些上了跟没上一样的东西上。与其坐在那儿等老师划重点，不如自己找课上、自己动手写。**时间是我自己的，我得知道它花到哪儿去了。**

## 我的线代笔记

假期就这样结束了。线代捡回了一点感觉，也确认了一件事：**我得学会自己学**。
