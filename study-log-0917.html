# 学习日志 · 9 月 17 日

## the LIST of what i learnt today
- $\lim_{x \to 0}\dfrac{sinx}{x} = 1$和$\lim_{x \to 0}\dfrac{1-cosx}{x} = 0$的证明
- 用上面两个极限推导$$\dfrac{d}{dx}sinx = cosx$$ $$\dfrac{d}{dx}cosx = -sinx$$
- geometric proof of the derivative of $sinx$ and $cosx$
- production,quotient,and chain rules of derivative
- implicit differentiation
- inverse function

## 我讲解一遍
-  $$\dfrac{d}{dx}sinx = cosx$$
      $$\dfrac{d}{dx}sinx$$ $$= \lim{\Delta x \to 0}\dfrac{sin(x+\Delta x)-sinx}{\Delta x}$$
      $$= \lim_{\Delta x \to 0}\dfrac{sinxcos\Delta x+cosxsin\Delta x-sinx}{\Delta x}$$
      $$= \lim_{\Delta x \to 0}sinx\dfrac{cos\Delta x-1}{\Delta x}+cosx\dfrac{sin\Delta x}{\Delta x}$$
      $$= cosx$$
  $\dfrac{d}{dx}cosx = -sinx$的证明同理
- $$\dfrac{d^n}{dx^n}x^n = n!$$
      由此或许可以联想1/2阶导数？或者1/2的阶乘？
- implicit differentiation<br>
      EX1:<br>
      $$x^2+y^2=1$$
        $$\dfrac{d}{dx}(x^2+y^2)=\dfrac{d}{dx}1$$
        $$2x+2yy'=0$$
        $$y'=-\dfrac{x}{y}$$
- inverse functions<br>
      if $y=f(x)$ and  $x=g(y)$ , then $g(f(x))=x$  or  $f(g(x))=x$ , <br>$g=f^-1$  and  $f=g^-1$<br>
      EX1:<br>
      $$tanx and tan^-1x$$
        for $y=tan^-1x$
        $$tany=x$$
        $$\dfrac{d}{dx}tany=\dfrac{d}{dx}x$$
        $$y'\dfrac{1}{cos^2y}=1$$
        $$y'=cos^2y$$
        由三角恒等关系可得
        $$y'=\dfrac{1}{x^2+1}<br>
      EX2:<br>$$sinx and sin^-1x$$
        $$y=arcsinx$$
        $$siny=x$$
        $$\dfrac{d}{dx}siny=\dfrac{d}{dx}x$$
        $$(cosy)y'=1$$
        $$y'=\dfrac{1}{\sqrt{1-x^2}}$$
