# 图书馆泡一天，线代终于通了

中秋第二天，早上还是睡到了 **11 点**才起来。不过今天跟昨天不一样——起来之后没有继续摆，吃过饭就直奔图书馆了。

## 线代：行列式，打通了

在图书馆一泡就是一天，主攻**线性代数**。

之前课上掉线的**行列式**，这次静下心一点一点啃，居然差不多都搞明白了。之前觉得乱糟糟的东西，捋顺之后感觉也没那么难。趁着状态好，又往后学了一点**矩阵**的内容。

## C 语言：变量

中间还听了 **C 语言的课**，学了**变量**这一块。跟线代轮着来，换换脑子，倒也不觉得累。

## 晚上操场跑步

晚上从图书馆出来，去操场**跑了个步**。

跑起来的时候脑子放空，一天的弦慢慢松下来，**挺解压的**。

---

今天算是把学习的状态找回来了。明天继续。
