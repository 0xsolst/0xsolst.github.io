# 英语课的第一记闷棍

今天就是**正常上课**，课表排得满满当当，没什么波澜。

## 英语课：听力直接把我打回原形

上午第一节是英语课。这是开学以来**第一节英语课**，上完我只想说一句：**我的听力实在是太差了**。

音频一放，人家的句子像流水一样过去了，我脑子里还在翻译前半句。听力烂，**口语也烂**——轮到自己开口，磕磕巴巴，跟高中背课文完全不是一回事。

但这个锅其实得我自己背：**高中三年，听力几乎没练过**。我们的英语课就是刷题、背单词、做阅读理解，听力占的分不多，也没人真管你会不会听。三年下来，这一块就是彻底荒废了。

现在上了大学，才发现这笔账得自己还。

## 音乐选修课：一天里的一点甜头

下午是选修的**音乐课**，这个挺有意思。

老师的风格我很喜欢——**那种「严肃的幽默」**：一本正经地讲，讲着讲着冒出一句让人想笑的，自己表情一点不变。而且这课能**免费学乐理**，对我这种想搞编曲的人来说不要太香。

唯一的问题是：**现在讲的那些，对我来说都太简单了**。毕竟自己已经在啃乐理和编曲了，课上还在讲最基础的部分。

不过免费的东西不能嫌，就当复习。

---

一天两门课：一门把我打回原形，一门给了我点甜头。
