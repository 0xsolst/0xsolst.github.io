# 上下午两节课都白上，晚上 Misc 又把我听懵了

## 上午：习思课，坐了一上午

上午是习思课，说实话，**从头到尾都没什么收获**。

也不是说老师讲得有多差，就是那种**听完跟没听一样**的感觉——下课铃一响，我脑子里剩不下什么东西，你让我说说今天讲了啥，我一句都总结不出来。

## 下午：自然科学导引，同样没什么感觉

下午接着上自然科学导引课，**收获也基本是零**。

连着两节课都是这个状态，下课的时候人是有点丧的。

## 中间：本来想再看看高数，结果一个字都看不进去

中间那点空档，我本来是打算**再看看高数**的——上次课上得还行，想趁热接着往前推一点。

结果就是**书翻开，什么都看不进去**。

不是没时间，也不是没事情做，纯粹是**脑子拒绝工作**：眼睛在动，脑子不动，盯着那几页看了半天，一个字都没进脑子。最后只能把书合上。

这种状态比上课没收获还难受——上课是别人没给你东西，这个是**你自己知道自己该学，但你就是学不动**。

## 晚上：朝鲜半岛问题研究，今天最好的一节课

晚上去上了**朝鲜半岛问题研究**，这节**是真有意思**。

现在回头看，今天唯一让我觉得"来对了"的就是这节课。

同样是一节课、同样是坐在下面听，感觉跟上午下午完全不一样——**这节是我自己愿意主动听的**。可能这就是有没有兴趣的区别吧。

（另外今天还收到了**学长送的咖啡**，算是这天的意外之喜。唯一的问题是我晚上喝了会不会睡不着。）

## 然后：Misc 入门，一晚上下来我什么都没听懂

晚上的重头戏是 **CTF 的 Misc 入门培训**。

结果就是四个字：**我什么都没听懂**。

讲的人**一点基础都不讲**，术语名词一个接一个往外蹦，我在底下跟听天书一样。我才刚接触 CTF 没多长时间，**连一些名词是什么意思都还不知道**，这种"入门"到底入的是谁的门？

（硬要说收获的话，也就是又听了一堆名词耳熟了一遍，但真让我自己上手，还是不知道从哪下第一手。）

## 关于这个培训，我有点话想说

连着上次那场培训一起看，我现在的感觉就是：**这群教 CTF 入门的人挺傲慢的**。

他们大概是站在"我已经会了"的位置上往下讲，忘了底下坐的是一群刚进门的人。**一点基础都不讲，这真的能叫入门吗？**

还有**那个迎新的题目，也弄得难得出奇**。我是真没看出来那玩意儿跟"迎新"有半毛钱关系——**这根本不是来迎新的，更像是来炫技的**。

我不指望一节课就学会做题，但**至少得让我知道题目里的每个词是什么意思**吧。一个连术语都要自己回去查的"入门培训"，说实话，听着挺泄气的。

---
一天三节课外加一场培训，最后的收获是：**一杯咖啡，和一堆问号**。明天继续。
