# 第一道 CTF，上手了

## CTF：第一道题，上手了

今天最大的事，是终于打开了 **CTF 的第一道题**。

之前啃了一堆概念、看了不少教程，总觉得还没准备好。真上手才发现——**学一百遍不如做一遍**。直接开题、自己解密、自己查、自己凑出答案，那个过程里学到的，比之前啃资料实在多了。

先是一口气过了三道 **PWN 题**，晚上又硬啃下了第四道——**shellcode 题**。这道题让我想通了好几个之前一直迷糊的底层概念，必须记下来。

### 第 4 题：会执行我输入内容的程序

用 IDA 反汇编出来，核心逻辑就几行（大意）：

```c
buf = mmap(nullptr, 0x1000, 7, 34, -1, 0);   // 申请 4096 字节、可读可写可执行的内存
read(0, buf, 0x100);                          // 读入最多 256 字节
((void (*)(void))buf)();                      // 把输入的内容当代码直接执行
```

翻译成人话：**程序会把我输入的内容，原封不动当成机器码跑起来**。所以我要做的就是输入一段能"打开 shell"的机器码——这就是 shellcode。

### 想通的三个底层概念

1. **机器码不是人背的，是汇编翻译来的**。人写汇编（`mov rax, 60` 这种助记符），交给"汇编器"翻成机器码（`\x48\xc7\xc0...`），CPU 只认机器码。

2. **写脚本为什么用 Python，而不是 C**。题目程序（C 写的）是被攻击的"门"，shellcode（机器码）是"弹药"，Python 脚本只是"遥控器"——负责生成 shellcode、连上题目、发过去、收结果。造遥控器这种活，Python 的 pwntools 现成又省事。

3. **32 位和 64 位 shellcode 不一样**。一开始用 `asm(shellcraft.sh())` 生成的机器码，末尾是 `\xcd\x80`（`int 0x80`，32 位老式系统调用），塞进 64 位程序会崩。改成 `context.arch = 'amd64'` 重新生成，末尾变成 `\x0f\x05`（`syscall`），系统调用号也从 11 变成 59，这次才对。

### 拿到 flag

把生成的 shellcode 发过去，`interactive()` 进入 shell，敲 `cat flag`，flag 到手。

中间还顺手想明白一件事：**为什么不直接把 `cat flag` 翻译成机器码，非要先开个 shell？** 因为开 shell 只要一个系统调用（`execve`），机器码短；直接读文件要 open + read + write 三个系统调用，更长更麻烦。而且弹了 shell 能到处翻、找 flag 在哪，直接 cat 得赌路径。这种"直接读 flag"（orw shellcode）其实是禁 execve 的沙箱题才会用的进阶技巧。
