# 体育课：大学里最难的学科

今天的结论听起来有点离谱，但是真的：**体育是大学里最难的学科。**

## 高数课：没之前那么难接受了

上午高数课，感觉还行，**没之前那么难接受了**。

这可能跟前面预习过有关系，也可能就是慢慢适应了。总之不像刚开学那会儿，一节课下来全是问号。

## 下午体育课：被现实按在地上摩擦

下午体育课，我算是认清了自己。

体能测试的标准摆在那儿：

- **长跑：4 分半及格**——我**只能跑到 5 分**；
- **俯卧撑：24 个及格**——我**最多做 10 个**，而且**做得还不标准**；
- **引体向上**：就更不用说了，完全是另一个世界的事。

跑完我当时就想：高数听不懂，我可以回去看书、看网课、慢慢磨；**体育不及格，是真的一点办法都没有，只能靠身体**。所以在我这儿，**体育是大学里最难的学科**。

（也得承认一件事：高中三年除了体育课和跑操，我基本没主动运动过。这笔账跟英语听力一样，都是以前欠的。）

## 晚上：CTF 新生赛第一次培训

晚上是**CTF 新生赛的第一次培训**。

讲的内容是**一些电脑使用的基础**，还教了**怎么下载 deepseekharness**。

说实话，**这些基础我基本上都已经有了**——毕竟前面自己折腾过环境、写过代码、踩过一堆坑。坐那儿听的时候有点「这我好像会」的感觉。

但我提醒自己**别太飘**：这只是赛前培训的第一节，教的都是最外围的东西。**真正上手做题的时候，会不会是另一回事**。

---

今天的两节课给了我同一个提醒：**欠下的东西，迟早都要还**。
