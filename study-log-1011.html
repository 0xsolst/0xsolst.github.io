# 社团大战 + 金秋艺术节：这天才像大学

周日，今天真的很精彩。**这几天过得特别快，但今天算是把「大学」这两个字体验了一遍。**

## 上午：睡到九点多自然醒

先睡到**九点多自然醒**，没有闹钟，没有早八。这个开局就已经是满分了。

起来之后**骑电动车去桂园操场**，看一年一度的**社团大战**。

## 社团大战：原来有这么多奇怪的社团

到那儿一看，是真的热闹。**台球社、电竞社、原创音乐社、街舞社**……五花八门，好多我压根没想到大学里会有的社团。

逛的时候挺心动的，但**我一个都没参加**。

原因是：**我现在的精力还不算太多**，课业加上自己那摊子事（高数、线代、C 语言、CTF），再往里塞社团，最后大概率是三头都做不好。先把手上的事做扎实，社团以后再说。

操场上还有**社团的节目表演**，站那儿看了一会儿。

## 下午：又回图书馆学了一下午

看完表演我就去图书馆了，**又学了一下午**。

这个安排现在对我来说很自然了：白天出去玩也好、看热闹也好，**该学的时间还是得学**。

## 晚上：操场上和台上互动的氛围，真的很好

晚上是**节目表演**，氛围超级好：**大家都坐在操场上，和台上的人互动**，那种感觉是高中三年从来没体验过的。

唯一可惜的是——**我最想听的「流行歌曲串烧」那个节目，我没看到**。反正就是错过了，有点遗憾。

## 金秋艺术节：合唱大赛，让我想起一件事

没看到串烧，我就**跑去看了金秋艺术节的合唱大赛**，在**梅园的小操场**。

然后站在那儿听着听着，**突然想起了我之前面试合唱团没通过的事**。

说实话，还是**感觉好可惜**。当时觉得自己还行，结果没进。现在听到人家在台上唱，心里那种感觉挺复杂的——有点羡慕，也有点不服。

不过换个角度想：**这学期我确实没那么多精力再塞一个合唱团进去了**。错过的东西就先记着，等有余力的时候再补。

---

今天没学多少，但过得特别值。**大学不只是课表上的那些课**。
