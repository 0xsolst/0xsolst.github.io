# 今天做了什么

选上班委啦，我当选学习委员了 :D

今天是"上任第零天"，把竞选 PPT 里的承诺拆成了能落地的事：

## 学习内容

- 发现大一上的数学是**两门并行**的：高等数学（微积分）+ 线性代数。之前一直只盯着微积分，线代被我漏掉了
- 重新整理了两门课的资源：中文教材跟学校进度，MIT 公开课 + 3Blue1Brown 用来理解概念、练英语
- 开始预习线性代数，先看 3Blue1Brown《线性代数的本质》前几集建立直觉
- review of differentiation
- applications of differentiation

## 我来讲一下

- two methods to deal with $\dfrac{d}{dx}x^r%
  *method 1:expoenets*
$$ \dfrac{d}{dx}x^r$$
$$=\dfrac{d}{dx}e^{x\ln x}$$
$$=e^{x\ln x} \cdot \dfrac{r}{x}$$
$$=x^r \codt \dfrac{r}{x}=rx^{r-1}$$
  *method 2:logarrithms*
$$ u=x^r$$
$$\ln u =r\ln x$$
$$(\ln u)'=\dfrac{u'}{u}=\dfrac{r}{x}$$
$$u'=x^r \cdot \dfrac{r}{x}=rx^{r-1}$$
- linear algebra

一种感受：竟然可以这样！

## 一点感想

微积分跟 MIT 18.01 学到后面，感觉进度偏慢，和学校高数 A1 的节奏对不上。想通了：英文公开课负责"吃透概念 + 练英语"，跟学校进度还是得靠中文教材刷题，两条腿走路。

## 明天计划

- 继续看线代本质，跟上学校《线性代数 A》的进度
