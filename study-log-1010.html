# 预习真的有用：高数课突然就轻松了

今天的关键词只有一个：**预习**。

## 军理课：我在下面复习高数

上午军理课，**说实话我没怎么听**，在下面偷偷复习高数。

这个不打算给自己找理由，就是没听。反正军理课的东西，考试前突击应该也来得及。

## 图书馆：往后又预习了一截

军理课一结束我就去图书馆了。把**后面还没讲的高数内容往后预习了一些**。

图书馆这个环境是真的好，坐在那儿没人打扰，一上午的效率比在宿舍高十倍。

## 下午高数课：轻松了很多

因为是提前看过的内容，**下午上高数课的感觉完全不一样了**——不像之前那样从头到尾一脸懵，起码知道老师下一步要讲什么。

之前我还以为高数就是难，现在明白了：**难的一部分原因是「完全没准备就去听」**。上课那一小时，如果脑子里一点底子都没有，老师讲得再清楚也跟不上。

这也算今天最大的收获了：**提前看一遍，上课就不是「听天书」，而是「对答案」**。

## 晚上：一口气睡了将近十二个小时

下午上完高数就没课了。这天我**居然很早就睡了**，一觉睡了将近**十二个小时**。

醒来的时候只有一个感觉：**舒服**。

---

前面几天欠的觉，今天一次性还清了。
