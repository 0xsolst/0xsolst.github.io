# 今天做了什么

今天军训考核，晚上依旧是很不重要的会议，只学习了高数。（哦哦哦哦）

## 学习

- EXPONENTIAL & LOGARITHMS

## 学习内容

- $$\dfrac{d}{dx}a^x$$
$$=\lim_{\Delta x \to 0 }\dfrac{a^{x+\Delta x}-a^x}{\Delta x}$$
$$=\lim_{\Delta x \to 0}a^x\dfrac{a^{\Delta x}-1}{\Delta x}$$
$$=a^x\lim_{\Delta x \to 0 }\dfrac{a^{\Delta x}-1}{\Delta x}$$
let $$M(a)=\lim_{\Delta x \to 0 }\dfrac{a^{\Delta x}-1}{\Delta x}$$
then $$\dfrac{d}{dx}a^x=a^x \cdot M(a)$$
$$\dfrac{d}{dx}a^x|_{x=0}=a^0 \cdot M(a)=M(a)$$
The question : What is $M(a)$ ?
      

      
**First of all** , 
      
let's define base '$e$' as the unique number so that $M(e)=1$
      
we have $\dfrac{d}{dx}e^x=e^x \cdot M(e)=e^x$
      
**second** , 
      
we need to consider the inverse function of  $y=e^x$
      
we define it as  $w=\ln x$
      
so  $e^w=x$
      
$$\dfrac{d}{dx}e^w=\dfrac{d}{dx}x$$
$$(\dfrac{d}{dw}e^w)(\dfrac{dw}{dx})=1$$
$$\dfrac{dw}{dx}=\dfrac{1}{e^w}=\dfrac{1}{x}$$
$$\dfrac{d}{dx}\ln x=\dfrac{1}{x}$$
- as we have defined $e^x$ and $lnx$ , let's see what happened:
      
$$\dfrac{d}{dx}a^x=\dfrac{d}{dx}(e^{\ln a})^x=\dfrac{d}{dx}e^{x\ln a}=\ln a \cdot e^{x\ln a}=a^x\ln a $$
so far , we have known $M(a)$ is what : 
$$ M(a)=\ln a $$
- sometimes when we need to compute $\dfrac{d}{dx}u$ , we can use the function '$ln$'
      
**EX:**
$$ \dfrac{d}{dx}\ln u=(\dfrac{d}{du}\ln u)(\dfrac{du}{dx})=\dfrac{1}{u}\dfrac{du}{dx} $$
$$ (\ln u)'=\dfrac{u'}{u} $$
- let's take $u=a^x$:
      
$$ \ln u=x\ln a $$
$$(\ln u)'=\ln a $$
$$ \dfrac{u'}{u}=\ln a $$
$$ u'=(a^x)'=u·lna=a^x\ln a $$
we have proved that again
      
**another EX:**
$$ v=x^x $$
$$ \ln v=x\ln x $$
$$ (\ln v)'=\dfrac{v'}{v}=1+\ln x $$
$$ \dfrac{d}{dx}x^x=x^x(1+\ln x) $$
the method we solve it is ***moving exponents***
      
- yet we still don't know what is '$e$'
      
let's see something different:
      
$$ \lim_{n \to +\infty}(1+\dfrac{1}{n})^n $$
let's use the method we called ***moving exponents***:
      
$$ \ln((1+\dfrac{1}{n})^n)=n\ln(1+\dfrac{1}{n}) $$
If we take $\Delta x$ as $\dfrac{1}{n}$ (as when $n \to \infty$, $\Delta x \to 0$), we get:

$$\ln\left((1+\dfrac{1}{n})^n\right)=\dfrac{1}{\Delta x}\ln(1+\Delta x)$$

Something different emerging:

$$=\dfrac{\ln(1+\Delta x)-\ln 1}{\Delta x}$$

It seems familiar:

$$\lim_{n \to +\infty}\ln\left((1+\dfrac{1}{n})^n\right)=\lim_{\Delta x \to 0}\dfrac{\ln(1+\Delta x)-\ln 1}{\Delta x}$$

$$=(\ln x)'\Big|\_{x=1}$$

$$=1$$

Then:

$$\lim_{n \to +\infty}\left(1+\dfrac{1}{n}\right)^n=e$$

Amazingly! We get $e$!

Meanwhile, the limit above is an important limit equation.
