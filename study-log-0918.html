# 今天做了什么

## 学习内容

- $$\dfrac{d}{dx}a^x$$
      $$=\lim_{\Delta x \to 0 }\dfrac{a^{x+\Delta x}}{\Delta x}$$
      $$=\lim_{\Delta x \to 0}a^x\dfrac{a^{\Delta x}-1}{\Delta x}$$
      $$=a^x\lim_{\Delta x \to 0 }\dfrac{a^{\Delta x}-1}{\Delta x}$$
      let $M(a)=\lim_{\Delta x \to 0 }\dfrac{a^{\Delta x}-1}{\Delta x}$<br>
      then $\dfrac{d}{dx}a^x|_{x=0}=a^0·M(a)=M(a)$<br>
      The question : What is $M(a)$ ?
      first of all , let's define base 'e' as the unique number so that $M(e)=1$<br>
      we have $\dfrac{d}{dx}e^x=e^x·M(e)=e^x$
      second , we need to consider the inverse function of $y=e^x$<br>
      we define it as $w=lnx$<br>
      so $e^w=x$<br>
      $$\dfrac{d}{dx}e^w=\dfrac{d}{dx}x$$
      $$(\dfrac{d}{dw}e^w)(\dfrac{dw}{dx})=1$$
      $$\dfrac{dw}{dx}=\dfrac{1}{e^w}=\dfrac{1}{x}$$
      $$\dfrac{d}{dx}lnx=\dfrac{1}{x}$$
- as we have defined $e^x$ and $lnx$ , let's see what happened:<br>
      $$\dfrac{d}{dx}a^x=\dfrac{d}{dx}(e^{lna})^x=\dfrac{d}{dx}e^{xlna}=lna·e^{xlna}=a^xlna$$
      so far , we have known $M(a)$ is what : $$M(a)=lna$$
- sometimes when we need to compute $\dfrac{d}{dx}u$ , we can use the function '$ln$'<br>
      EX:<br>
      $$\dfrac{d}{dx}lnu=(\dfrac{d}{du}lnu)(\dfrac{du}{dx}=\dfrac{1}{u}\dfrac{du}{dx}$$
      $$(lnu)'=\dfrac{u'}{u}$$
- let's take $u=a^x$:<br>
      $$lnu=xlna$$
      $$(lnu)'=lna$$
      $$\dfrac{u'}{u}=lna$$
      $$u'=(a^x)'=u·lna=a^xlna$$
    we have proved that again<br>
      another EX:<br>
      $$v=x^x$$
      $$lnv=xlnx$$
      $$(lnv)'=\dfrac{v'}{v}=1+lnx$$
      $$\dfrac{d}{dx}x^x=x^x(1+lnx)$$
    the method we sove it is moving exponents<br>
- yet we still don't l=know what is '$e$'<br>
      let's see something different:<br>
      $$\lim_{n \to \infity}(1+\dfrac{1}{n})^n$$
      let's use the method we called moving expoenents:<br>
      $$ln(1+\dfrac{1}{n})^n=nln(1+\dfrac{1}{n})$$
      if we take $\Delta x$ as $\dfrac{1}{n}$<br>
      we get :
      $$(1+\dfrac{1}{n})^n=\dfrac{1}{\Delta x}ln(1+\Delta x)$$
      something different emerging:
      $$=\dfrac{ln(1+\Delta x}-ln1}{\Delta x}$$
      it seems familiar<br>
      $$\lim_{n \to \infity}ln((1+\dfrac{1}{n})^n)=\lim_{\Delta x \to 0 }\dfrac{ln(1+\Delta x}-ln1}{\Delta x}$$
      $$=(lnx)'|_{x=1}$$
      $$=1$$
      then
      $$\lim_{n \to \infity}((1+\dfrac{1}{n})^n)=e$$
      amazingly!we get '$e$'!<br>
      obviously we can use the limit to compute the accurate number of '$e$'<br>
      meanwhile , the limit above is an important limit equation.<br>
