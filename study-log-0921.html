# 正式上课第一天

今天正式开始上课，第一天，主打一个「终于有大学的样子了」。

## 第一节高数课

第一节高数，基本是开场白——老师自我介绍，讲了下这门课怎么考、怎么学、后面怎么安排。真正的「硬菜」还没上桌，先认识一下。

## 第一节体育课 · 第一次校园跑

第一节体育课就安排了**校园跑**。第一天就让我认清了自己的体能现状——跑步 app 记着里程，我记着自己有多喘。

## 晚上：很厉害的学姐分享

晚上有个学姐来分享，讲她的大学经历，真的很厉害。听完有点被激励到：原来大学生活可以过得这么有目标感。

## 入党申请书

晚上回去，把**入党申请书**一笔一划写了。也算给正式上课的第一天，画了个正经的句号。

---

第一天没有太硬核的内容，但**仪式感拉满**：第一节高数、第一次校园跑、一份入党申请书。大学生活，好像真的开始了。
