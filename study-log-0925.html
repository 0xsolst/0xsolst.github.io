# 中秋第一天，直接耍起

中秋假期的第一天，主打一个放松。

## 睡到自然醒

上午直接睡到 **10 点多**才起床。这应该是我开学以来睡得最久的一次了，放假嘛，就得这么过。

## 光谷 + 宿舍宅

起来之后又去**光谷**玩了一圈。下午回宿舍直接宅着，啥也没干，纯摆烂。

## 晚上图书馆，把线代啃下来了

晚上去了图书馆，把之前没搞懂的**线性代数**又翻出来看了看。

神奇的是，这次自己静下心一点点捋，居然看明白了。之前课上跟不上的地方，慢慢也就顺了，**感觉轻松多了**。

看来这东西，还是得靠自己啃。

## 操场遛弯

从图书馆出来又去操场转了几圈。吹吹风、走走路，**感觉精力恢复了不少**。

操场上热闹得很：唱歌的、踢球的、玩击剑的、跑步的、吹笛子的、拉小提琴的，还有弹三弦的。

## 想把我的乐器寄来学校

看别人吹笛子、拉琴、弹三弦，我也心动了，想把我的长笛和合成器寄到学校来。

但问题来了——宿舍就那点地方，**88 键的合成器根本不知道往哪儿放**。这事儿还得再想想。

## 一点感悟

越来越觉得，**学习最终还是得靠自学**。

线性代数现在越看越有意思了，C 语言也不能荒废，得继续自学下去！！！

---

放假第一天，松弛但也不算白过。明天继续。
