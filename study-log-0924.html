# 又是啥也没干的一天

## 线代：老师讲的和 MIT 差挺多

上午线性代数。这门课我之前在 MIT 的公开课上接触过一点，结果发现**学校老师讲的路子，和 MIT 上学的很不一样**。

前面还能跟上，讲到 **n 阶行列式**那块就彻底掉线了，后半段基本没听懂。

（补记这篇的时候，我自己又翻出来研究了一遍，总算是看明白了。看来这课还是得靠自己啃。）

## 程序设计：第一节课，也没听进去

下午是程序设计的第一节课。怎么说呢，也是什么都没听进去。

C 语言我决定还是**按 B 站黑马程序员的课自学**，再结合一下课本《面向安全思维的程序设计基础》。这个路子比较适合我。

## 放假了！

下午课上完就没课了，直接进入**中秋假期**。

## 开摆

下午晚上直接耍起来。去**广八路**转了转，吃了一碗烩面，又去买了心心念念的**鸡蛋灌饼**。

有时候一天的重点，就是这几口吃的。

今天确实是「啥也没干」的一天。线代没听懂（但后来自己补回来了），C 语言定了自学路线，剩下的时间都用来吃好喝好了。
